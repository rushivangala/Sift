name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-24.04
    outputs:
      sdk: ${{ steps.sdk.outputs.sdk }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Pick compile SDK (37 = Android 17, else 36)
        id: sdk
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37" > /tmp/sdk37.log 2>&1 || true
          if [ -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            echo "sdk=37" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::platforms;android-37 is not installable on this runner; building against API 36. sdkmanager: $(tail -3 /tmp/sdk37.log | tr '\n' ' ') | available: $(sdkmanager --list 2>/dev/null | grep -oE 'platforms;android-[0-9A-Za-z.-]+' | sort -u | tail -4 | tr '\n' ' ')"
            sdkmanager --install "platforms;android-36" > /dev/null
            echo "sdk=36" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -Psift.sdk=${{ steps.sdk.outputs.sdk }} 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease -Psift.sdk=${{ steps.sdk.outputs.sdk }} 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Lint
        run: ./gradlew --no-daemon lintDebug -Psift.sdk=${{ steps.sdk.outputs.sdk }} 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Report build errors as annotations
        if: failure()
        run: ./scripts/annotate-errors.sh build.log

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sift-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/sift-release.apk
          ls -la dist
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging dist/sift-release.apk | grep -E "package:|sdkVersion|targetSdkVersion" || true

      - uses: actions/upload-artifact@v4
        with:
          name: sift-apks
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  device-tests:
    name: Device tests · API ${{ matrix.api }} · Pixel 10 Pro screen
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [36, 37]
    continue-on-error: ${{ matrix.api == 37 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install compile platform
        run: sdkmanager --install "platforms;android-${{ needs.build.outputs.sdk }}" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/emulator-tests.sh ${{ needs.build.outputs.sdk }} device-shots

      - name: Report test failures as annotations
        if: failure()
        run: ./scripts/annotate-errors.sh device-shots/gradle.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-shots-api${{ matrix.api }}
          path: |
            device-shots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  release:
    name: Publish APK
    runs-on: ubuntu-24.04
    needs: [build, device-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sift-apks
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: device-shots-api36
          path: shots
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-build.${{ github.run_number }}"
          if [ -d shots ]; then find shots -name "*.png" | sort | zip -qj dist/sift-screenshots.zip -@ || true; fi
          gh release create "$TAG" dist/* \
            --title "Sift $TAG" \
            --notes "Built from ${GITHUB_SHA::7} against API ${{ needs.build.outputs.sdk }}. Install sift-release.apk on a Pixel 10 Pro (Android 14+, targets Android 17). Signed with a CI debug key." \
            --latest
